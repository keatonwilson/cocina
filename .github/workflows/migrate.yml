name: Migrate Database

# One Supabase project: merging to main applies new migrations to it.
# Never apply SQL through the Supabase editor, or CI thinks the migration never ran.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

# Never two pushes to the same database at once
concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0   # the same CLI as ci.yml, so tests and production agree
      - run: |
          supabase db push --db-url "$SUPABASE_DB_URL"
          supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
